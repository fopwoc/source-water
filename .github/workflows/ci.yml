name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/assets/**'
      - '**/*.md'
      - COPYRIGHT
      - LICENSE
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/assets/**'
      - '**/*.md'
      - COPYRIGHT
      - LICENSE

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools zip

      - name: Validate shaders
        run: ./scripts/check.sh

      - name: Build shader pack
        run: ./scripts/build.sh

      - name: Upload shader pack
        uses: actions/upload-artifact@v7
        with:
          name: source-water-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
