name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          git fetch origin master
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/master

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools zip

      - name: Validate shaders
        run: ./scripts/check.sh

      - name: Build shader pack
        run: ./scripts/build.sh "${{ github.ref_name }}"

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag=$(git tag \
            --merged "${GITHUB_SHA}^{commit}" \
            --list '[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -Fvx "$RELEASE_TAG" \
            | head -n 1)

          if [ -n "$previous_tag" ]; then
            git log \
              --format='- %s (`%h`)' \
              "$previous_tag..${GITHUB_SHA}^{commit}" \
              > "$RUNNER_TEMP/release-notes.md"
          else
            git log \
              --format='- %s (`%h`)' \
              "${GITHUB_SHA}^{commit}" \
              > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --verify-tag \
            --title "Source Water $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
