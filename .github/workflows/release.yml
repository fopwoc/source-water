name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release source
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools zip

      - name: Validate shaders
        run: ./scripts/check.sh

      - name: Build shader pack
        run: ./scripts/build.sh "${{ github.ref_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --verify-tag \
            --title "Source Water $RELEASE_TAG" \
            --generate-notes
